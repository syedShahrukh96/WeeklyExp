<body>
<div id="root"></div>

<script type="text/plain" id="app-source">
const { useState, useEffect, useMemo } = React;

const APP_VERSION = "1.3.1";

const firebaseConfig = {
  apiKey: "AIzaSyBaImgKdKXWSr8mwPLfsSkB-oTvCQz7Lls",
  authDomain: "weeklyexp-506e3.firebaseapp.com",
  projectId: "weeklyexp-506e3",
  storageBucket: "weeklyexp-506e3.firebasestorage.app",
  messagingSenderId: "976630617032",
  appId: "1:976630617032:web:e3206646c709d45be266fd",
};

// ---------- data layer ----------
function makeFirebaseStore(cfg){
  firebase.initializeApp(cfg);
  const db = firebase.firestore();
  const peopleCol = db.collection("people");
  const metaDoc = db.collection("meta").doc("config");
  return {
    mode:"cloud",
    subscribeAll(cb){ return peopleCol.onSnapshot(s=>cb(s.docs.map(d=>({slug:d.id,...d.data()}))),()=>{}); },
    async getPerson(slug){ const d=await peopleCol.doc(slug).get(); return d.exists?d.data():null; },
    async setPerson(slug,data){ await peopleCol.doc(slug).set(data,{merge:true}); },
    async replacePerson(slug,data){ await peopleCol.doc(slug).set(data); },
    async deletePerson(slug){ await peopleCol.doc(slug).delete(); },
    async getConfig(){ const d=await metaDoc.get(); return d.exists?d.data():null; },
    async setConfig(c){ await metaDoc.set(c,{merge:true}); },
  };
}
function makeLocalStore(){
  const KEY="wb-local-db";
  const read=()=>{ try{return JSON.parse(localStorage.getItem(KEY))||{people:{},config:null};}catch(e){return {people:{},config:null};} };
  const listFrom=(s)=>Object.entries(s.people).map(([slug,v])=>({slug,...v}));
  let listeners=[];
  const notify=()=>{ const l=listFrom(read()); listeners.forEach(fn=>fn(l)); };
  window.addEventListener("storage",notify);
  return {
    mode:"local",
    subscribeAll(cb){ listeners.push(cb); cb(listFrom(read())); return ()=>{listeners=listeners.filter(f=>f!==cb);}; },
    async getPerson(slug){ return read().people[slug]||null; },
    async setPerson(slug,data){ const s=read(); s.people[slug]={...(s.people[slug]||{}),...data}; localStorage.setItem(KEY,JSON.stringify(s)); notify(); },
    async replacePerson(slug,data){ const s=read(); s.people[slug]=data; localStorage.setItem(KEY,JSON.stringify(s)); notify(); },
    async deletePerson(slug){ const s=read(); delete s.people[slug]; localStorage.setItem(KEY,JSON.stringify(s)); notify(); },
    async getConfig(){ return read().config; },
    async setConfig(c){ const s=read(); s.config={...(s.config||{}),...c}; localStorage.setItem(KEY,JSON.stringify(s)); notify(); },
  };
}
const usingPlaceholder = Object.values(firebaseConfig).some(v=>String(v).includes("PASTE_HERE"));
let store;
try { store = usingPlaceholder ? makeLocalStore() : makeFirebaseStore(firebaseConfig); }
catch(e){ console.warn("Local mode:",e); store = makeLocalStore(); }

// ---------- pin hashing (casual privacy) ----------
async function hashPin(slug, pin){
  const msg = slug + "::" + pin;
  try{
    if(window.crypto && window.crypto.subtle){
      const buf = await window.crypto.subtle.digest("SHA-256", new TextEncoder().encode(msg));
      return "s"+Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
    }
  }catch(e){}
  let h=5381; for(let i=0;i<msg.length;i++){ h=((h<<5)+h+msg.charCodeAt(i))>>>0; }
  return "f"+h.toString(16);
}

// ---------- tokens ----------
const T = {
  bg:"#0E1013", bgTop:"#141821", surface:"#191C22", surface2:"#22262F",
  line:"#2A2F3A", text:"#F4F5F7", muted:"#8B909C", faint:"#5C616D",
  mint:"#5EEAD4", amber:"#FBBF24", rose:"#FB7185",
  mono:"ui-monospace,'SF Mono','Menlo',monospace",
  sans:"-apple-system,BlinkMacSystemFont,'SF Pro',system-ui,sans-serif",
};
const CATEGORIES = [
  {id:"food",label:"Food",icon:"🍜"},{id:"transport",label:"Transport",icon:"🚕"},
  {id:"shopping",label:"Shopping",icon:"🛍️"},{id:"bills",label:"Bills",icon:"🧾"},
  {id:"fun",label:"Fun",icon:"🎬"},{id:"health",label:"Health",icon:"💊"},{id:"other",label:"Other",icon:"•"},
];
const CURRENCIES = ["$","₹","€","£","Rp","₨","₦","¥","৳"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

const uid = () => Math.random().toString(36).slice(2,10);
const slugify = (s) => s.trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const monthKey = (d) => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const parseMonthKey = (k) => { const p=k.split("-").map(Number); return new Date(p[0],p[1]-1,1); };
const daysInMonth = (k) => { const d=parseMonthKey(k); return new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); };
const weeksInMonth = (k) => Math.ceil(daysInMonth(k)/7);
const catOf = (id) => CATEGORIES.find(c=>c.id===id) || CATEGORIES[CATEGORIES.length-1];
const fmt = (n) => new Intl.NumberFormat("en-US",{maximumFractionDigits:0}).format(Math.round(n));
const displayName = (p) => (p.locked && p.publicName) ? p.publicName : (p.locked ? "Hidden" : p.name);

// =================================================================
function App(){
  const now = new Date();
  const [ready,setReady] = useState(false);
  const [config,setConfig] = useState({currency:"$",defaultBudget:100});
  const [allPeople,setAllPeople] = useState([]);
  const [me,setMe] = useState(null);
  const [person,setPerson] = useState(null);
  const [mKey,setMKey] = useState(monthKey(now));
  const [week,setWeek] = useState(Math.min(Math.ceil(now.getDate()/7),6));
  const [showSettings,setShowSettings] = useState(false);
  const [showEveryone,setShowEveryone] = useState(false);
  const [showPrivacy,setShowPrivacy] = useState(false);
  const [pending,setPending] = useState(null); // {slug, person, name}
  const [pinError,setPinError] = useState("");
  const [showAdmin,setShowAdmin] = useState(false);

  async function saveConfigMerge(patch){ const next=Object.assign({},config,patch); setConfig(next); await store.setConfig(next); }
  // admin: reset a person's pins / privacy (does not reveal their data)
  async function adminResetPerson(slug){
    const p = await store.getPerson(slug); if(!p) return;
    await store.setPerson(slug, {locked:false, pinHash:null, viewPinHash:null});
  }
  async function adminDeletePerson(slug){ await store.deletePerson(slug); if(slug===me){ localStorage.removeItem("wb-me"); setMe(null); setPerson(null); } }

  useEffect(()=>{
    const unsub = store.subscribeAll(list=>setAllPeople(list));
    (async()=>{
      try{ const c=await store.getConfig(); if(c) setConfig(c); }catch(e){}
      const saved = localStorage.getItem("wb-me");
      if(saved){ try{ const p=await store.getPerson(saved); if(p){ setMe(saved); setPerson(p); } }catch(e){} }
      setReady(true);
    })();
    return ()=>{ if(unsub) unsub(); };
  },[]);

  // keep signed-in person fresh from live data
  useEffect(()=>{
    if(!me) return;
    const live = allPeople.find(p=>p.slug===me);
    if(live) setPerson(prev => prev ? {...prev, name:live.name, publicName:live.publicName, locked:live.locked, pinHash:live.pinHash, viewPinHash:live.viewPinHash} : prev);
  },[allPeople,me]);

  function finalizeJoin(slug, p, name){
    (async()=>{
      let doc = p;
      if(!doc){ doc = { name:name.trim(), publicName:"", locked:false, pinHash:null, viewPinHash:null, data:{} }; await store.setPerson(slug,doc); }
      localStorage.setItem("wb-me", slug);
      setMe(slug); setPerson(doc); setPending(null); setPinError("");
      setMKey(monthKey(new Date())); setWeek(Math.min(Math.ceil(new Date().getDate()/7),6));
    })();
  }
  async function attemptJoinName(name){
    const slug = slugify(name); if(!slug) return;
    const p = await store.getPerson(slug);
    if(p && p.locked){ setPinError(""); setPending({slug, person:p, name:p.name}); }
    else finalizeJoin(slug, p, name);
  }
  async function attemptJoinSlug(slug){
    const p = await store.getPerson(slug);
    if(p && p.locked){ setPinError(""); setPending({slug, person:p, name:p.name}); }
    else finalizeJoin(slug, p, p?p.name:slug);
  }
  async function submitJoinPin(pin){
    if(!pending) return;
    const h = await hashPin(pending.slug, pin);
    if(h === pending.person.pinHash){ finalizeJoin(pending.slug, pending.person, pending.person.name); }
    else setPinError("Wrong PIN. Try again.");
  }

  function switchUser(){ localStorage.removeItem("wb-me"); setMe(null); setPerson(null); }
  async function deletePerson(slug){
    await store.deletePerson(slug);
    if(slug===me){ localStorage.removeItem("wb-me"); setMe(null); setPerson(null); }
  }

  const weekData = useMemo(()=>{
    if(!person) return {budget:config.defaultBudget, expenses:[]};
    const w = person.data && person.data[mKey] && person.data[mKey][week];
    return {budget: (w&&w.budget!=null)?w.budget:config.defaultBudget, expenses: (w&&w.expenses)||[]};
  },[person,mKey,week,config.defaultBudget]);

  const spent = weekData.expenses.reduce((s,e)=>s+e.amount,0);
  const remaining = weekData.budget - spent;
  const frac = weekData.budget>0 ? Math.min(spent/weekData.budget,1) : 0;

  async function commitPerson(next){ setPerson(next); if(me) await store.setPerson(me,next); }
  function patchWeek(patch){
    const data = Object.assign({}, person.data||{});
    const m = Object.assign({}, data[mKey]||{});
    const cur = m[week] || {budget:config.defaultBudget, expenses:[]};
    m[week] = Object.assign({}, cur, patch); data[mKey]=m;
    commitPerson(Object.assign({}, person, {data}));
  }
  const addExpense = (exp)=>patchWeek({budget:weekData.budget, expenses:[exp,...weekData.expenses]});
  const removeExpense = (id)=>patchWeek({budget:weekData.budget, expenses:weekData.expenses.filter(e=>e.id!==id)});
  const setWeekBudget = (v)=>patchWeek({budget:v, expenses:weekData.expenses});

  async function updateMeta(patch){ const next=Object.assign({},person,patch); await commitPerson(next); }

  function shiftMonth(dir){ const d=parseMonthKey(mKey); d.setMonth(d.getMonth()+dir);
    setMKey(monthKey(d)); setWeek(w=>Math.min(w,weeksInMonth(monthKey(d)))); }
  async function saveConfig(next){ setConfig(next); await store.setConfig(next); }

  if(!ready) return <div style={Object.assign({},screenBase,{alignItems:"center",justifyContent:"center"})}>
    <div style={{color:T.muted,fontFamily:T.sans}}>Loading…</div></div>;

  if(pending) return <PinGate title={"Enter PIN for "+pending.name}
    message="This person is private. Enter their PIN to open."
    error={pinError} onCancel={()=>{setPending(null);setPinError("");}} onSubmit={submitJoinPin} />;

  if(!me || !person) return <NameScreen people={allPeople} onJoinName={attemptJoinName} onJoinSlug={attemptJoinSlug} local={store.mode==="local"}
    config={config} onOpenAdmin={()=>setShowAdmin(true)} adminSheet={showAdmin} onCloseAdmin={()=>setShowAdmin(false)}
    onSaveAdminPin={h=>saveConfigMerge({adminHash:h})} onAdminReset={adminResetPerson} onAdminDelete={adminDeletePerson} />;

  const cur = config.currency;
  const md = parseMonthKey(mKey);
  const nWeeks = weeksInMonth(mKey);
  const ringColor = frac>=1 ? T.rose : (remaining/weekData.budget<=0.2 ? T.amber : T.mint);

  return (
    <div style={screenBase}>
      <div style={{maxWidth:440,margin:"0 auto",padding:"18px 18px 40px"}}>
        {store.mode==="local" && <div style={{marginBottom:12,padding:"8px 12px",borderRadius:10,background:"rgba(251,191,36,0.12)",border:"1px solid "+T.amber,color:T.amber,fontFamily:T.sans,fontSize:12,textAlign:"center"}}>Local mode — add Firebase keys to sync.</div>}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:38,height:38,borderRadius:12,background:T.mint,color:T.bg,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:T.sans,fontWeight:800,fontSize:16}}>{person.name.slice(0,1).toUpperCase()}</div>
            <div>
              <div style={{fontFamily:T.sans,fontSize:15,fontWeight:700,color:T.text,display:"flex",alignItems:"center",gap:6}}>{person.name} {person.locked && <span title="Private" style={{fontSize:12}}>🔒</span>}</div>
              <button onClick={switchUser} style={{background:"none",border:"none",padding:0,color:T.faint,fontFamily:T.sans,fontSize:12,cursor:"pointer"}}>Switch person</button>
            </div>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>setShowPrivacy(true)} style={gearBtn} title="Privacy & PIN">🔒</button>
            <button onClick={()=>setShowEveryone(true)} style={gearBtn} title="Everyone">👥</button>
            <button onClick={()=>setShowSettings(true)} style={gearBtn} title="Settings">⚙</button>
          </div>
        </div>

        <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:10,marginBottom:16}}>
          <IconBtn onClick={()=>shiftMonth(-1)}>‹</IconBtn>
          <div style={{fontFamily:T.sans,fontSize:18,fontWeight:700,color:T.text,minWidth:150,textAlign:"center"}}>{MONTHS[md.getMonth()]} {md.getFullYear()}</div>
          <IconBtn onClick={()=>shiftMonth(1)}>›</IconBtn>
        </div>

        <div style={{display:"flex",gap:8,overflowX:"auto",paddingBottom:4,marginBottom:20}}>
          {Array.from({length:nWeeks},(_,i)=>i+1).map(w=>{ const active=w===week;
            return <button key={w} onClick={()=>setWeek(w)} style={{flex:"0 0 auto",padding:"9px 16px",borderRadius:999,border:"1px solid "+(active?"transparent":T.line),background:active?T.text:"transparent",color:active?T.bg:T.muted,fontFamily:T.sans,fontSize:14,fontWeight:600,cursor:"pointer"}}>Week {w}</button>;})}
        </div>

        <div style={{background:"linear-gradient(180deg,"+T.bgTop+","+T.surface+")",border:"1px solid "+T.line,borderRadius:26,padding:"26px 20px 22px",display:"flex",flexDirection:"column",alignItems:"center",marginBottom:16}}>
          <Ring frac={frac} color={ringColor}>
            <div style={{fontFamily:T.sans,fontSize:12,color:T.muted,letterSpacing:1,textTransform:"uppercase"}}>{remaining>=0?"Left to spend":"Over budget"}</div>
            <div style={{fontFamily:T.mono,fontSize:remaining<0?30:34,fontWeight:700,color:remaining<0?T.rose:T.text,marginTop:6,letterSpacing:-1}}>{cur}{fmt(Math.abs(remaining))}</div>
            <div style={{fontFamily:T.mono,fontSize:13,color:T.faint,marginTop:4}}>of {cur}{fmt(weekData.budget)}</div>
          </Ring>
          <div style={{display:"flex",gap:16,marginTop:18,alignItems:"center"}}>
            <Stat label="Spent" value={cur+fmt(spent)} color={T.text} />
            <div style={{width:1,height:32,background:T.line}} />
            <Stat label="Left" value={cur+fmt(remaining)} color={remaining<0?T.rose:T.mint} />
            <div style={{width:1,height:32,background:T.line}} />
            <BudgetEditor cur={cur} value={weekData.budget} onSave={setWeekBudget} />
          </div>
        </div>

        <AddExpense cur={cur} onAdd={addExpense} />

        <div style={{marginTop:22}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:10}}>
            <div style={{fontFamily:T.sans,fontSize:15,fontWeight:700,color:T.text}}>This week</div>
            <div style={{fontFamily:T.sans,fontSize:13,color:T.faint}}>{weekData.expenses.length} {weekData.expenses.length===1?"entry":"entries"}</div>
          </div>
          {weekData.expenses.length===0 ?
            <div style={{border:"1px dashed "+T.line,borderRadius:18,padding:"30px 20px",textAlign:"center",color:T.faint,fontFamily:T.sans,fontSize:14}}>No expenses yet.<br/>Add your first one above.</div>
          :
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {weekData.expenses.map(e=>{ const c=catOf(e.category);
                return <div key={e.id} style={rowStyle}>
                  <div style={{width:40,height:40,borderRadius:12,background:T.surface2,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>{c.icon}</div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontFamily:T.sans,fontSize:15,fontWeight:600,color:T.text,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{e.note||c.label}</div>
                    <div style={{fontFamily:T.sans,fontSize:12,color:T.faint}}>{c.label}</div>
                  </div>
                  <div style={{fontFamily:T.mono,fontSize:15,fontWeight:700,color:T.text,marginRight:4}}>{cur}{fmt(e.amount)}</div>
                  <button onClick={()=>removeExpense(e.id)} style={delBtn}>×</button>
                </div>;})}
            </div>
          }
        </div>

        <MonthOverview person={person} mKey={mKey} nWeeks={nWeeks} cur={cur} defaultBudget={config.defaultBudget} onJump={setWeek} selected={week} />
        <div style={{marginTop:20,fontFamily:T.mono,fontSize:10,color:T.faint,textAlign:"center"}}>v{APP_VERSION}</div>
      </div>

      {showSettings && <Settings config={config} onClose={()=>setShowSettings(false)} onCurrency={c=>saveConfig(Object.assign({},config,{currency:c}))} onDefault={v=>saveConfig(Object.assign({},config,{defaultBudget:v}))} />}
      {showPrivacy && <PrivacySheet person={person} onClose={()=>setShowPrivacy(false)} onUpdate={updateMeta} onDeleteMe={()=>{ setShowPrivacy(false); deletePerson(me); }} />}
      {showEveryone && <EveryoneSheet people={allPeople} mKey={mKey} week={week} cur={cur} defaultBudget={config.defaultBudget} meSlug={me} onDelete={deletePerson} onClose={()=>setShowEveryone(false)} />}
    </div>
  );
}

// ---------- pin gate (full screen) ----------
function PinGate({title,message,error,onCancel,onSubmit}){
  const [pin,setPin]=useState("");
  return <div style={Object.assign({},screenBase,{alignItems:"center",justifyContent:"center",padding:24})}>
    <div style={{width:"100%",maxWidth:340,textAlign:"center"}}>
      <div style={{fontSize:34,marginBottom:8}}>🔒</div>
      <div style={{fontFamily:T.sans,fontSize:20,fontWeight:800,color:T.text}}>{title}</div>
      <div style={{fontFamily:T.sans,fontSize:14,color:T.muted,marginTop:8}}>{message}</div>
      <input autoFocus type="password" inputMode="numeric" maxLength={6} placeholder="● ● ● ● ● ●" value={pin}
        onChange={e=>setPin(e.target.value.replace(/[^0-9]/g,""))}
        onKeyDown={e=>{if(e.key==="Enter"&&pin.length===6)onSubmit(pin);}}
        style={{width:"100%",boxSizing:"border-box",marginTop:20,padding:"14px",background:T.surface,border:"1px solid "+(error?T.rose:T.line),borderRadius:14,color:T.text,fontFamily:T.mono,fontSize:24,letterSpacing:8,textAlign:"center",outline:"none"}} />
      {error && <div style={{color:T.rose,fontFamily:T.sans,fontSize:13,marginTop:8}}>{error}</div>}
      <button onClick={()=>pin.length===6&&onSubmit(pin)} disabled={pin.length!==6} style={{width:"100%",marginTop:14,padding:14,borderRadius:14,border:"none",background:pin.length===6?T.mint:T.surface2,color:pin.length===6?T.bg:T.faint,fontFamily:T.sans,fontSize:16,fontWeight:700,cursor:pin.length===6?"pointer":"default"}}>Unlock</button>
      <button onClick={onCancel} style={{width:"100%",marginTop:10,padding:12,borderRadius:14,border:"none",background:"transparent",color:T.muted,fontFamily:T.sans,fontSize:14,cursor:"pointer"}}>Back</button>
    </div>
  </div>;
}

// ---------- inline pin modal (for reveal in Everyone) ----------
function PinModal({title,message,error,onCancel,onSubmit}){
  const [pin,setPin]=useState("");
  return <div onClick={onCancel} style={Object.assign({},sheetWrap,{alignItems:"center"})}>
    <div onClick={e=>e.stopPropagation()} style={{width:"100%",maxWidth:340,background:T.surface,borderRadius:20,border:"1px solid "+T.line,padding:22,textAlign:"center"}}>
      <div style={{fontFamily:T.sans,fontSize:17,fontWeight:700,color:T.text}}>{title}</div>
      {message && <div style={{fontFamily:T.sans,fontSize:13,color:T.muted,marginTop:6}}>{message}</div>}
      <input autoFocus type="password" inputMode="numeric" maxLength={6} placeholder="● ● ● ● ● ●" value={pin}
        onChange={e=>setPin(e.target.value.replace(/[^0-9]/g,""))}
        onKeyDown={e=>{if(e.key==="Enter"&&pin.length===6)onSubmit(pin);}}
        style={{width:"100%",boxSizing:"border-box",marginTop:16,padding:"12px",background:T.surface2,border:"1px solid "+(error?T.rose:T.line),borderRadius:12,color:T.text,fontFamily:T.mono,fontSize:22,letterSpacing:6,textAlign:"center",outline:"none"}} />
      {error && <div style={{color:T.rose,fontFamily:T.sans,fontSize:12,marginTop:6}}>{error}</div>}
      <div style={{display:"flex",gap:8,marginTop:14}}>
        <button onClick={onCancel} style={{flex:1,padding:12,borderRadius:12,border:"1px solid "+T.line,background:"transparent",color:T.muted,fontFamily:T.sans,fontSize:14,fontWeight:600,cursor:"pointer"}}>Cancel</button>
        <button onClick={()=>pin.length===6&&onSubmit(pin)} disabled={pin.length!==6} style={{flex:1,padding:12,borderRadius:12,border:"none",background:pin.length===6?T.mint:T.surface2,color:pin.length===6?T.bg:T.faint,fontFamily:T.sans,fontSize:14,fontWeight:700,cursor:pin.length===6?"pointer":"default"}}>OK</button>
      </div>
    </div>
  </div>;
}

// ---------- privacy / pin management ----------
function PrivacySheet({person,onClose,onUpdate,onDeleteMe}){
  const [view,setView]=useState("home"); // home | setpin | changepin | viewpin | delete
  const [p1,setP1]=useState(""); const [p2,setP2]=useState(""); const [pub,setPub]=useState(person.publicName||""); const [msg,setMsg]=useState("");

  async function enablePin(){
    if(p1.length!==6){ setMsg("PIN must be 6 digits."); return; }
    if(p1!==p2){ setMsg("PINs don't match."); return; }
    const h=await hashPin(slugify(person.name), p1);
    await onUpdate({locked:true, pinHash:h, publicName: pub.trim()});
    setP1("");setP2("");setMsg(""); setView("home");
  }
  async function changePin(){
    if(p1.length!==6){ setMsg("PIN must be 6 digits."); return; }
    if(p1!==p2){ setMsg("PINs don't match."); return; }
    const h=await hashPin(slugify(person.name), p1);
    await onUpdate({pinHash:h}); setP1("");setP2("");setMsg(""); setView("home");
  }
  async function setViewPin(){
    if(p1 && p1.length!==6){ setMsg("PIN must be 6 digits."); return; }
    const h = p1 ? await hashPin(slugify(person.name), p1) : null;
    await onUpdate({viewPinHash:h}); setP1("");setMsg(""); setView("home");
  }
  async function savePublic(){ await onUpdate({publicName:pub.trim()}); setMsg("Saved."); }
  async function turnOff(){ await onUpdate({locked:false, pinHash:null, viewPinHash:null}); setView("home"); }

  return <div onClick={onClose} style={sheetWrap}><div onClick={e=>e.stopPropagation()} style={sheetBody}>
    <div style={grab}/>
    <div style={{fontFamily:T.sans,fontSize:18,fontWeight:700,color:T.text,marginBottom:4}}>Privacy & PIN</div>
    <div style={{fontFamily:T.sans,fontSize:12,color:T.faint,marginBottom:18}}>Casual privacy only — hides you from friends in the app, not from a determined hacker.</div>

    {view==="home" && <div style={{display:"flex",flexDirection:"column",gap:10}}>
      <div style={{padding:"12px 14px",borderRadius:12,background:T.surface2,fontFamily:T.sans,fontSize:14,color:T.text}}>
        Status: {person.locked ? <b style={{color:T.mint}}>Private 🔒</b> : <b style={{color:T.amber}}>Open (anyone can see/edit)</b>}
      </div>
      {!person.locked ?
        <PrivRow label="Set a 6-digit PIN (make private)" onClick={()=>{setView("setpin");setMsg("");}} /> :
        <>
          <PrivRow label="Change PIN" onClick={()=>{setView("changepin");setMsg("");}} />
          <PrivRow label="View-only PIN for friends" sub="Lets a friend see (not edit) your details" onClick={()=>{setView("viewpin");setMsg("");}} />
          <div>
            <div style={{fontFamily:T.sans,fontSize:12,color:T.muted,margin:"6px 0"}}>Public name (shown to others)</div>
            <div style={{display:"flex",gap:8}}>
              <input value={pub} onChange={e=>setPub(e.target.value)} placeholder="e.g. NameHidden" style={{flex:1,boxSizing:"border-box",padding:"11px 12px",background:T.surface2,border:"1px solid "+T.line,borderRadius:12,color:T.text,fontFamily:T.sans,fontSize:15,outline:"none"}} />
              <button onClick={savePublic} style={{padding:"0 16px",borderRadius:12,border:"none",background:T.mint,color:T.bg,fontFamily:T.sans,fontSize:14,fontWeight:700,cursor:"pointer"}}>Save</button>
            </div>
          </div>
          <PrivRow label="Turn off privacy" danger onClick={turnOff} />
        </>
      }
      <PrivRow label="Delete everything (my account)" danger onClick={()=>{setView("delete");setMsg("");}} />
      {msg && <div style={{color:T.mint,fontFamily:T.sans,fontSize:13}}>{msg}</div>}
      <button onClick={onClose} style={doneBtn}>Done</button>
    </div>}

    {(view==="setpin"||view==="changepin") && <div>
      <div style={{fontFamily:T.sans,fontSize:15,fontWeight:700,color:T.text,marginBottom:12}}>{view==="setpin"?"Create your PIN":"Change your PIN"}</div>
      <PinField label="New 6-digit PIN" value={p1} onChange={setP1} />
      <PinField label="Repeat PIN" value={p2} onChange={setP2} />
      {msg && <div style={{color:T.rose,fontFamily:T.sans,fontSize:13,marginTop:6}}>{msg}</div>}
      {view==="setpin" && <>
        <div style={{fontFamily:T.sans,fontSize:12,color:T.muted,marginTop:12,marginBottom:4}}>Public name shown to others (optional)</div>
        <input value={pub} onChange={e=>setPub(e.target.value)} placeholder="e.g. NameHidden" style={{width:"100%",boxSizing:"border-box",padding:"11px 12px",background:T.surface2,border:"1px solid "+T.line,borderRadius:12,color:T.text,fontFamily:T.sans,fontSize:15,outline:"none"}} />
      </>}
      <div style={{display:"flex",gap:8,marginTop:16}}>
        <button onClick={()=>{setView("home");setMsg("");setP1("");setP2("");}} style={ghostBtn}>Back</button>
        <button onClick={view==="setpin"?enablePin:changePin} style={primaryBtn}>Save PIN</button>
      </div>
    </div>}

    {view==="viewpin" && <div>
      <div style={{fontFamily:T.sans,fontSize:15,fontWeight:700,color:T.text,marginBottom:6}}>View-only PIN</div>
      <div style={{fontFamily:T.sans,fontSize:13,color:T.muted,marginBottom:12}}>Share this PIN with a friend so they can SEE your expenses but not edit or delete. Leave blank and save to remove it.</div>
      <PinField label="View-only PIN (or blank to clear)" value={p1} onChange={setP1} />
      {msg && <div style={{color:T.rose,fontFamily:T.sans,fontSize:13,marginTop:6}}>{msg}</div>}
      <div style={{display:"flex",gap:8,marginTop:16}}>
        <button onClick={()=>{setView("home");setMsg("");setP1("");}} style={ghostBtn}>Back</button>
        <button onClick={setViewPin} style={primaryBtn}>Save</button>
      </div>
    </div>}

    {view==="delete" && <div>
      <div style={{fontFamily:T.sans,fontSize:15,fontWeight:700,color:T.rose,marginBottom:6}}>Delete everything</div>
      <div style={{fontFamily:T.sans,fontSize:13,color:T.muted,marginBottom:16}}>This permanently removes your name and all your expenses. This can't be undone.</div>
      <div style={{display:"flex",gap:8}}>
        <button onClick={()=>setView("home")} style={ghostBtn}>Cancel</button>
        <button onClick={onDeleteMe} style={{flex:1,padding:12,borderRadius:12,border:"none",background:T.rose,color:T.bg,fontFamily:T.sans,fontSize:14,fontWeight:700,cursor:"pointer"}}>Delete forever</button>
      </div>
    </div>}
  </div></div>;
}
function PrivRow({label,sub,onClick,danger}){
  return <button onClick={onClick} style={{textAlign:"left",padding:"12px 14px",borderRadius:12,border:"1px solid "+T.line,background:T.surface,cursor:"pointer"}}>
    <div style={{fontFamily:T.sans,fontSize:14,fontWeight:600,color:danger?T.rose:T.text}}>{label}</div>
    {sub && <div style={{fontFamily:T.sans,fontSize:12,color:T.faint,marginTop:2}}>{sub}</div>}
  </button>;
}
function PinField({label,value,onChange}){
  return <div style={{marginTop:10}}>
    <div style={{fontFamily:T.sans,fontSize:12,color:T.muted,marginBottom:4}}>{label}</div>
    <input type="password" inputMode="numeric" maxLength={6} value={value} onChange={e=>onChange(e.target.value.replace(/[^0-9]/g,""))}
      style={{width:"100%",boxSizing:"border-box",padding:"12px",background:T.surface2,border:"1px solid "+T.line,borderRadius:12,color:T.text,fontFamily:T.mono,fontSize:20,letterSpacing:6,textAlign:"center",outline:"none"}} />
  </div>;
}

// ---------- everyone ----------
function EveryoneSheet({people,mKey,week,cur,defaultBudget,meSlug,onDelete,onClose}){
  const [confirmSlug,setConfirmSlug]=useState(null);
  const [revealed,setRevealed]=useState({}); // slug -> 'primary'|'view'
  const [unlockSlug,setUnlockSlug]=useState(null);
  const [pinErr,setPinErr]=useState("");

  function levelFor(p){
    if(!p.locked) return "primary";      // open: full
    if(p.slug===meSlug) return "primary"; // yourself
    return revealed[p.slug] || null;
  }
  async function tryUnlock(pin){
    const p = people.find(x=>x.slug===unlockSlug); if(!p) return;
    const h = await hashPin(p.slug, pin);
    if(h===p.pinHash){ setRevealed(r=>({...r,[p.slug]:"primary"})); setUnlockSlug(null); setPinErr(""); }
    else if(p.viewPinHash && h===p.viewPinHash){ setRevealed(r=>({...r,[p.slug]:"view"})); setUnlockSlug(null); setPinErr(""); }
    else setPinErr("Wrong PIN.");
  }

  const rows = people.map(p=>{
    const w = p.data && p.data[mKey] && p.data[mKey][week];
    const budget = (w&&w.budget!=null)?w.budget:defaultBudget;
    const spent = ((w&&w.expenses)||[]).reduce((s,e)=>s+e.amount,0);
    let mSpent=0; const mm=(p.data&&p.data[mKey])||{};
    Object.keys(mm).forEach(k=>{((mm[k].expenses)||[]).forEach(e=>mSpent+=e.amount);});
    return {slug:p.slug,name:p.name,locked:!!p.locked,publicName:p.publicName,pinHash:p.pinHash,viewPinHash:p.viewPinHash,budget,spent,mSpent,data:p.data};
  });
  rows.sort((a,b)=>b.spent-a.spent);

  return <div onClick={onClose} style={sheetWrap}><div onClick={e=>e.stopPropagation()} style={sheetBody}>
    <div style={grab}/>
    <div style={{fontFamily:T.sans,fontSize:18,fontWeight:700,color:T.text,marginBottom:4}}>Everyone · Week {week}</div>
    <div style={{fontFamily:T.sans,fontSize:13,color:T.faint,marginBottom:18}}>{MONTHS[parseMonthKey(mKey).getMonth()]} {parseMonthKey(mKey).getFullYear()}</div>
    {rows.length===0 ? <div style={{color:T.faint,fontFamily:T.sans,padding:20,textAlign:"center"}}>No one has joined yet.</div> :
    <div style={{display:"flex",flexDirection:"column",gap:8,maxHeight:"55vh",overflowY:"auto"}}>
      {rows.map(r=>{
        const level = (!r.locked||r.slug===meSlug) ? "primary" : (revealed[r.slug]||null);
        const shown = !!level;
        const rem=r.budget-r.spent; const frac=r.budget>0?Math.min(r.spent/r.budget,1):0; const over=r.spent>r.budget; const bar=over?T.rose:(frac>=0.8?T.amber:T.mint);
        const canDelete = level==="primary";
        const label = shown ? (r.name + (r.slug===meSlug?" (you)":"")) : (r.publicName||"Hidden");
        return <div key={r.slug} style={{background:r.slug===meSlug?T.surface2:T.surface,border:"1px solid "+(r.slug===meSlug?T.mint:"transparent"),borderRadius:14,padding:"12px 14px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,gap:8}}>
            <span style={{fontFamily:T.sans,fontSize:14,fontWeight:700,color:T.text,display:"flex",alignItems:"center",gap:6}}>{label} {r.locked && <span style={{fontSize:11}}>🔒</span>}</span>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              {shown ? <span style={{fontFamily:T.mono,fontSize:13,color:over?T.rose:T.mint}}>{rem<0?"-":""}{cur}{fmt(Math.abs(rem))} left</span>
                     : <button onClick={()=>{setUnlockSlug(r.slug);setPinErr("");}} style={{padding:"5px 12px",borderRadius:999,border:"1px solid "+T.line,background:"transparent",color:T.mint,fontFamily:T.sans,fontSize:12,fontWeight:700,cursor:"pointer"}}>Enter PIN</button>}
              {canDelete && <button onClick={()=>setConfirmSlug(r.slug)} title="Remove" style={{width:26,height:26,borderRadius:8,border:"none",background:T.surface2,color:T.faint,fontSize:14,lineHeight:"1",cursor:"pointer",flexShrink:0}}>🗑</button>}
            </div>
          </div>
          {shown ? <>
            <div style={{height:6,background:T.surface2,borderRadius:999,overflow:"hidden"}}><div style={{width:(frac*100)+"%",height:"100%",background:bar,borderRadius:999}}/></div>
            <div style={{display:"flex",justifyContent:"space-between",marginTop:6}}>
              <span style={{fontFamily:T.mono,fontSize:11,color:T.faint}}>Week: {cur}{fmt(r.spent)} / {cur}{fmt(r.budget)}</span>
              <span style={{fontFamily:T.mono,fontSize:11,color:T.faint}}>Month: {cur}{fmt(r.mSpent)}</span>
            </div>
            {level==="view" && <div style={{fontFamily:T.sans,fontSize:11,color:T.faint,marginTop:6}}>View-only — you can see but not edit or delete.</div>}
          </> : <div style={{fontFamily:T.sans,fontSize:12,color:T.faint}}>Private. Enter this person's PIN to view.</div>}

          {confirmSlug===r.slug && <div style={{marginTop:10,padding:"10px 12px",borderRadius:10,background:"rgba(251,113,133,0.10)",border:"1px solid "+T.rose}}>
            <div style={{fontFamily:T.sans,fontSize:13,color:T.text,marginBottom:8}}>Delete <b>{r.name}</b> and all their expenses? Can't be undone.</div>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>setConfirmSlug(null)} style={{flex:1,padding:9,borderRadius:9,border:"1px solid "+T.line,background:"transparent",color:T.muted,fontFamily:T.sans,fontSize:13,fontWeight:600,cursor:"pointer"}}>Cancel</button>
              <button onClick={()=>{onDelete(r.slug);setConfirmSlug(null);}} style={{flex:1,padding:9,borderRadius:9,border:"none",background:T.rose,color:T.bg,fontFamily:T.sans,fontSize:13,fontWeight:700,cursor:"pointer"}}>Delete</button>
            </div>
          </div>}
        </div>;})}
    </div>}
    <button onClick={onClose} style={doneBtn}>Done</button>

    {unlockSlug && <PinModal title="Enter PIN" message="Enter this person's PIN to view their expenses." error={pinErr}
      onCancel={()=>{setUnlockSlug(null);setPinErr("");}} onSubmit={tryUnlock} />}
  </div></div>;
}

// ---------- leaf UI ----------
function NameScreen({people,onJoinName,onJoinSlug,local,config,onOpenAdmin,adminSheet,onCloseAdmin,onSaveAdminPin,onAdminReset,onAdminDelete}){
  const [name,setName]=useState("");
  return <div style={Object.assign({},screenBase,{alignItems:"center",justifyContent:"center",padding:24})}>
    <div style={{width:"100%",maxWidth:380}}>
      <div style={{fontFamily:T.sans,fontSize:13,letterSpacing:2,color:T.faint,textTransform:"uppercase",fontWeight:600,textAlign:"center"}}>Weekly Budget</div>
      <div style={{fontFamily:T.sans,fontSize:26,fontWeight:800,color:T.text,textAlign:"center",marginTop:8}}>What's your name?</div>
      <div style={{fontFamily:T.sans,fontSize:14,color:T.muted,textAlign:"center",marginTop:8,lineHeight:1.5}}>Enter your name to track your own weekly spending. Everyone keeps their own separate list.</div>
      <input autoFocus placeholder="Your name" value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")onJoinName(name);}}
        style={{width:"100%",boxSizing:"border-box",marginTop:22,padding:"14px 16px",background:T.surface,border:"1px solid "+T.line,borderRadius:14,color:T.text,fontFamily:T.sans,fontSize:17,outline:"none",textAlign:"center"}} />
      <button onClick={()=>onJoinName(name)} disabled={!name.trim()} style={{width:"100%",marginTop:12,padding:14,borderRadius:14,border:"none",background:name.trim()?T.mint:T.surface2,color:name.trim()?T.bg:T.faint,fontFamily:T.sans,fontSize:16,fontWeight:700,cursor:name.trim()?"pointer":"default"}}>Continue</button>
      {people.length>0 && <div style={{marginTop:26}}>
        <div style={{fontFamily:T.sans,fontSize:12,color:T.faint,textAlign:"center",marginBottom:10}}>Or tap your name if you're rejoining</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:8,justifyContent:"center"}}>
          {people.map(p=><button key={p.slug} onClick={()=>onJoinSlug(p.slug)} style={{padding:"8px 14px",borderRadius:999,border:"1px solid "+T.line,background:T.surface,color:T.text,fontFamily:T.sans,fontSize:14,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",gap:5}}>{displayName(p)} {p.locked && <span style={{fontSize:11}}>🔒</span>}</button>)}
        </div>
      </div>}
      {local && <div style={{marginTop:20,fontFamily:T.sans,fontSize:12,color:T.amber,textAlign:"center"}}>Local mode — add Firebase keys for sync.</div>}
      <div style={{marginTop:22,textAlign:"center"}}>
        <button onClick={onOpenAdmin} style={{background:"none",border:"none",color:T.faint,fontFamily:T.sans,fontSize:12,cursor:"pointer",textDecoration:"underline"}}>Admin · reset a forgotten PIN</button>
      </div>
      <div style={{marginTop:16,fontFamily:T.mono,fontSize:10,color:T.faint,textAlign:"center"}}>v{APP_VERSION}</div>
    </div>
    {adminSheet && <AdminSheet people={people} config={config} onClose={onCloseAdmin} onSaveAdminPin={onSaveAdminPin} onReset={onAdminReset} onDelete={onAdminDelete} />}
  </div>;
}

function AdminSheet({people,config,onClose,onSaveAdminPin,onReset,onDelete}){
  const hasAdmin = !!config.adminHash;
  const [authed,setAuthed]=useState(false);
  const [view,setView]=useState(hasAdmin?"login":"setup"); // login | setup | list
  const [p1,setP1]=useState(""); const [p2,setP2]=useState(""); const [err,setErr]=useState("");
  const [confirm,setConfirm]=useState(null);

  async function doSetup(){
    if(p1.length!==6){ setErr("Master PIN must be 6 digits."); return; }
    if(p1!==p2){ setErr("PINs don't match."); return; }
    const h=await hashPin("__admin__", p1);
    await onSaveAdminPin(h); setAuthed(true); setView("list"); setErr(""); setP1("");setP2("");
  }
  async function doLogin(){
    const h=await hashPin("__admin__", p1);
    if(h===config.adminHash){ setAuthed(true); setView("list"); setErr(""); setP1(""); }
    else setErr("Wrong master PIN.");
  }

  return <div onClick={onClose} style={sheetWrap}><div onClick={e=>e.stopPropagation()} style={sheetBody}>
    <div style={grab}/>
    <div style={{fontFamily:T.sans,fontSize:18,fontWeight:700,color:T.text,marginBottom:4}}>Admin</div>
    <div style={{fontFamily:T.sans,fontSize:12,color:T.faint,marginBottom:18}}>Reset a forgotten PIN or remove someone. Can't view private expenses.</div>

    {view==="setup" && <div>
      <div style={{fontFamily:T.sans,fontSize:14,color:T.text,marginBottom:12}}>No master PIN yet. Create one — keep it safe, it can reset anyone's PIN.</div>
      <PinField label="Master PIN (6 digits)" value={p1} onChange={setP1} />
      <PinField label="Repeat master PIN" value={p2} onChange={setP2} />
      {err && <div style={{color:T.rose,fontFamily:T.sans,fontSize:13,marginTop:6}}>{err}</div>}
      <div style={{display:"flex",gap:8,marginTop:16}}>
        <button onClick={onClose} style={ghostBtn}>Cancel</button>
        <button onClick={doSetup} style={primaryBtn}>Create master PIN</button>
      </div>
    </div>}

    {view==="login" && <div>
      <PinField label="Enter master PIN" value={p1} onChange={setP1} />
      {err && <div style={{color:T.rose,fontFamily:T.sans,fontSize:13,marginTop:6}}>{err}</div>}
      <div style={{display:"flex",gap:8,marginTop:16}}>
        <button onClick={onClose} style={ghostBtn}>Cancel</button>
        <button onClick={doLogin} style={primaryBtn}>Unlock admin</button>
      </div>
    </div>}

    {view==="list" && authed && <div>
      <div style={{display:"flex",flexDirection:"column",gap:8,maxHeight:"52vh",overflowY:"auto"}}>
        {people.length===0 ? <div style={{color:T.faint,fontFamily:T.sans,padding:16,textAlign:"center"}}>No people yet.</div> :
          people.map(p=><div key={p.slug} style={{background:T.surface,border:"1px solid "+T.line,borderRadius:14,padding:"12px 14px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{fontFamily:T.sans,fontSize:14,fontWeight:700,color:T.text,display:"flex",alignItems:"center",gap:6}}>{p.name} {p.locked?<span style={{fontSize:11}}>🔒</span>:<span style={{fontFamily:T.sans,fontSize:11,color:T.faint}}>open</span>}</span>
            </div>
            {confirm===p.slug ? <div style={{marginTop:10,display:"flex",gap:8}}>
              <button onClick={()=>setConfirm(null)} style={{flex:1,padding:9,borderRadius:9,border:"1px solid "+T.line,background:"transparent",color:T.muted,fontFamily:T.sans,fontSize:13,fontWeight:600,cursor:"pointer"}}>Cancel</button>
              <button onClick={()=>{onDelete(p.slug);setConfirm(null);}} style={{flex:1,padding:9,borderRadius:9,border:"none",background:T.rose,color:T.bg,fontFamily:T.sans,fontSize:13,fontWeight:700,cursor:"pointer"}}>Delete forever</button>
            </div> : <div style={{marginTop:10,display:"flex",gap:8}}>
              <button onClick={()=>onReset(p.slug)} disabled={!p.locked} style={{flex:1,padding:9,borderRadius:9,border:"1px solid "+T.line,background:"transparent",color:p.locked?T.mint:T.faint,fontFamily:T.sans,fontSize:13,fontWeight:700,cursor:p.locked?"pointer":"default"}}>Reset PIN</button>
              <button onClick={()=>setConfirm(p.slug)} style={{padding:"9px 14px",borderRadius:9,border:"1px solid "+T.line,background:"transparent",color:T.rose,fontFamily:T.sans,fontSize:13,fontWeight:700,cursor:"pointer"}}>Delete</button>
            </div>}
          </div>)}
      </div>
      <div style={{fontFamily:T.sans,fontSize:12,color:T.faint,marginTop:12}}>“Reset PIN” removes that person's PIN and privacy so they can set a new one next time they open their name.</div>
      <button onClick={onClose} style={doneBtn}>Done</button>
    </div>}
  </div></div>;
}

function Ring({frac,color,children}){
  const size=190,stroke=14,r=(size-stroke)/2,C=2*Math.PI*r;
  return <div style={{position:"relative",width:size,height:size}}>
    <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={T.surface2} strokeWidth={stroke}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeLinecap="round" strokeDasharray={C} strokeDashoffset={C*(1-frac)} style={{transition:"stroke-dashoffset .5s ease, stroke .3s ease"}}/>
    </svg>
    <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",textAlign:"center"}}>{children}</div>
  </div>;
}
function Stat({label,value,color}){ return <div style={{textAlign:"center"}}>
  <div style={{fontFamily:T.sans,fontSize:11,color:T.muted,textTransform:"uppercase",letterSpacing:1}}>{label}</div>
  <div style={{fontFamily:T.mono,fontSize:17,fontWeight:700,color:color,marginTop:3}}>{value}</div></div>; }
function BudgetEditor({cur,value,onSave}){
  const [editing,setEditing]=useState(false); const [v,setV]=useState(String(value));
  useEffect(()=>setV(String(value)),[value]);
  if(editing) return <div style={{textAlign:"center"}}>
    <div style={{fontFamily:T.sans,fontSize:11,color:T.muted,textTransform:"uppercase",letterSpacing:1}}>Budget</div>
    <input autoFocus inputMode="decimal" value={v} onChange={e=>setV(e.target.value.replace(/[^0-9.]/g,""))} onBlur={()=>{onSave(Number(v)||0);setEditing(false);}} onKeyDown={e=>{if(e.key==="Enter"){onSave(Number(v)||0);setEditing(false);}}}
      style={{width:84,background:"transparent",border:"none",borderBottom:"1px solid "+T.mint,color:T.text,fontFamily:T.mono,fontSize:17,fontWeight:700,textAlign:"center",outline:"none",marginTop:3}}/></div>;
  return <button onClick={()=>setEditing(true)} style={{background:"none",border:"none",cursor:"pointer",padding:0,textAlign:"center"}}>
    <div style={{fontFamily:T.sans,fontSize:11,color:T.muted,textTransform:"uppercase",letterSpacing:1}}>Budget ✎</div>
    <div style={{fontFamily:T.mono,fontSize:17,fontWeight:700,color:T.mint,marginTop:3}}>{cur}{fmt(value)}</div></button>;
}
function AddExpense({cur,onAdd}){
  const [amount,setAmount]=useState(""); const [note,setNote]=useState(""); const [cat,setCat]=useState("food");
  function submit(){ const n=Number(amount); if(!n||n<=0) return; onAdd({id:uid(),amount:n,note:note.trim(),category:cat,date:new Date().toISOString()}); setAmount(""); setNote(""); }
  return <div style={{background:T.surface,border:"1px solid "+T.line,borderRadius:20,padding:16}}>
    <div style={{display:"flex",gap:10}}>
      <div style={{position:"relative",flex:"0 0 42%"}}>
        <span style={{position:"absolute",left:14,top:"50%",transform:"translateY(-50%)",fontFamily:T.mono,color:T.muted,fontSize:18}}>{cur}</span>
        <input inputMode="decimal" placeholder="0" value={amount} onChange={e=>setAmount(e.target.value.replace(/[^0-9.]/g,""))} onKeyDown={e=>{if(e.key==="Enter")submit();}}
          style={{width:"100%",boxSizing:"border-box",padding:"12px 12px 12px 32px",background:T.surface2,border:"1px solid "+T.line,borderRadius:14,color:T.text,fontFamily:T.mono,fontSize:20,fontWeight:700,outline:"none"}}/>
      </div>
      <input placeholder="What for?" value={note} onChange={e=>setNote(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")submit();}}
        style={{flex:1,minWidth:0,boxSizing:"border-box",padding:"12px 14px",background:T.surface2,border:"1px solid "+T.line,borderRadius:14,color:T.text,fontFamily:T.sans,fontSize:15,outline:"none"}}/>
    </div>
    <div style={{display:"flex",gap:7,overflowX:"auto",marginTop:12,paddingBottom:2}}>
      {CATEGORIES.map(c=>{ const on=c.id===cat;
        return <button key={c.id} onClick={()=>setCat(c.id)} style={{flex:"0 0 auto",padding:"7px 12px",borderRadius:999,border:"1px solid "+(on?T.mint:T.line),background:on?"rgba(94,234,212,0.12)":"transparent",color:on?T.mint:T.muted,fontFamily:T.sans,fontSize:13,fontWeight:600,cursor:"pointer"}}>{c.icon} {c.label}</button>;})}
    </div>
    <button onClick={submit} disabled={!amount} style={{width:"100%",marginTop:12,padding:13,borderRadius:14,border:"none",background:amount?T.mint:T.surface2,color:amount?T.bg:T.faint,fontFamily:T.sans,fontSize:16,fontWeight:700,cursor:amount?"pointer":"default"}}>Add expense</button>
  </div>;
}
function MonthOverview({person,mKey,nWeeks,cur,defaultBudget,onJump,selected}){
  const m=(person.data&&person.data[mKey])||{}; let totalSpent=0,totalBudget=0;
  const rows=Array.from({length:nWeeks},(_,i)=>i+1).map(w=>{ const wd=m[w]||{}; const budget=wd.budget!=null?wd.budget:defaultBudget; const spent=(wd.expenses||[]).reduce((s,e)=>s+e.amount,0); totalSpent+=spent; totalBudget+=budget; return {w,budget,spent}; });
  return <div style={{marginTop:26}}>
    <div style={{fontFamily:T.sans,fontSize:15,fontWeight:700,color:T.text,marginBottom:12}}>Month overview</div>
    <div style={{display:"flex",flexDirection:"column",gap:8}}>
      {rows.map(o=>{ const frac=o.budget>0?Math.min(o.spent/o.budget,1):0; const over=o.spent>o.budget; const bar=over?T.rose:(frac>=0.8?T.amber:T.mint);
        return <button key={o.w} onClick={()=>onJump(o.w)} style={{textAlign:"left",background:o.w===selected?T.surface2:T.surface,border:"1px solid "+(o.w===selected?T.line:"transparent"),borderRadius:14,padding:"12px 14px",cursor:"pointer"}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
            <span style={{fontFamily:T.sans,fontSize:14,fontWeight:600,color:T.text}}>Week {o.w}</span>
            <span style={{fontFamily:T.mono,fontSize:13,color:over?T.rose:T.muted}}>{cur}{fmt(o.spent)} / {cur}{fmt(o.budget)}</span>
          </div>
          <div style={{height:6,background:T.surface2,borderRadius:999,overflow:"hidden"}}><div style={{width:(frac*100)+"%",height:"100%",background:bar,borderRadius:999,transition:"width .4s"}}/></div>
        </button>;})}
    </div>
    <div style={{display:"flex",justifyContent:"space-between",marginTop:14,padding:"14px 16px",background:"linear-gradient(180deg,"+T.bgTop+","+T.surface+")",border:"1px solid "+T.line,borderRadius:14}}>
      <span style={{fontFamily:T.sans,fontSize:14,fontWeight:700,color:T.text}}>Month total</span>
      <span style={{fontFamily:T.mono,fontSize:15,fontWeight:700,color:totalSpent>totalBudget?T.rose:T.mint}}>{cur}{fmt(totalSpent)} <span style={{color:T.faint,fontWeight:400}}>/ {cur}{fmt(totalBudget)}</span></span>
    </div>
  </div>;
}
function Settings({config,onClose,onCurrency,onDefault}){
  const [def,setDef]=useState(String(config.defaultBudget));
  return <div onClick={onClose} style={sheetWrap}><div onClick={e=>e.stopPropagation()} style={sheetBody}>
    <div style={grab}/>
    <div style={{fontFamily:T.sans,fontSize:18,fontWeight:700,color:T.text,marginBottom:20}}>Settings</div>
    <div style={{fontFamily:T.sans,fontSize:13,color:T.muted,marginBottom:8}}>Currency (shared by the whole group)</div>
    <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:22}}>
      {CURRENCIES.map(c=>{ const on=c===config.currency;
        return <button key={c} onClick={()=>onCurrency(c)} style={{width:46,height:46,borderRadius:12,border:"1px solid "+(on?T.mint:T.line),background:on?"rgba(94,234,212,0.12)":T.surface2,color:on?T.mint:T.text,fontFamily:T.mono,fontSize:17,fontWeight:700,cursor:"pointer"}}>{c}</button>;})}
    </div>
    <div style={{fontFamily:T.sans,fontSize:13,color:T.muted,marginBottom:8}}>Default weekly budget</div>
    <input inputMode="decimal" value={def} onChange={e=>setDef(e.target.value.replace(/[^0-9.]/g,""))} onBlur={()=>onDefault(Number(def)||0)}
      style={{width:"100%",boxSizing:"border-box",padding:"12px 14px",background:T.surface2,border:"1px solid "+T.line,borderRadius:12,color:T.text,fontFamily:T.mono,fontSize:17,fontWeight:700,outline:"none",marginBottom:6}}/>
    <div style={{fontFamily:T.sans,fontSize:12,color:T.faint}}>New weeks start with this amount. Anyone can still change their own week.</div>
    <button onClick={onClose} style={doneBtn}>Done</button>
  </div></div>;
}

const screenBase={minHeight:"100vh",background:"radial-gradient(120% 60% at 50% 0%, "+T.bgTop+" 0%, "+T.bg+" 55%)",color:T.text,fontFamily:T.sans,display:"flex",flexDirection:"column"};
const rowStyle={display:"flex",alignItems:"center",gap:12,background:T.surface,border:"1px solid "+T.line,borderRadius:16,padding:"10px 12px"};
const delBtn={width:28,height:28,borderRadius:8,border:"none",background:T.surface2,color:T.faint,fontSize:18,lineHeight:"1",cursor:"pointer",flexShrink:0};
const gearBtn={width:42,height:42,borderRadius:12,border:"1px solid "+T.line,background:T.surface,color:T.muted,fontSize:18,cursor:"pointer"};
const sheetWrap={position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:50};
const sheetBody={width:"100%",maxWidth:440,background:T.surface,borderTopLeftRadius:24,borderTopRightRadius:24,border:"1px solid "+T.line,padding:"22px 20px 34px",maxHeight:"88vh",overflowY:"auto"};
const grab={width:40,height:4,background:T.line,borderRadius:999,margin:"0 auto 20px"};
const doneBtn={width:"100%",marginTop:18,padding:13,borderRadius:14,border:"none",background:T.text,color:T.bg,fontFamily:T.sans,fontSize:16,fontWeight:700,cursor:"pointer"};
const ghostBtn={flex:1,padding:12,borderRadius:12,border:"1px solid "+T.line,background:"transparent",color:T.muted,fontFamily:T.sans,fontSize:14,fontWeight:600,cursor:"pointer"};
const primaryBtn={flex:1,padding:12,borderRadius:12,border:"none",background:T.mint,color:T.bg,fontFamily:T.sans,fontSize:14,fontWeight:700,cursor:"pointer"};
function IconBtn({children,onClick}){ return <button onClick={onClick} style={{width:32,height:32,borderRadius:10,border:"1px solid "+T.line,background:T.surface,color:T.text,fontSize:20,lineHeight:"1",cursor:"pointer"}}>{children}</button>; }

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
(function(){
  var root = document.getElementById("root");
  function fail(m){ root.innerHTML =
    '<div style="color:#F4F5F7;background:#0E1013;font-family:-apple-system,system-ui,sans-serif;padding:32px 24px;text-align:center;min-height:100vh;box-sizing:border-box">'
    + '<div style="font-size:40px;margin-bottom:12px">📡</div>'
    + '<div style="font-size:18px;font-weight:700;margin-bottom:8px">Couldn\'t load the app</div>'
    + '<div style="font-size:14px;color:#8B909C;line-height:1.5;max-width:320px;margin:0 auto">'
    + m + '</div>'
    + '<button onclick="location.reload()" style="margin-top:20px;padding:12px 22px;border:none;border-radius:12px;background:#5EEAD4;color:#0E1013;font-weight:700;font-size:15px;cursor:pointer">Try again</button>'
    + '</div>'; }

  function start(){
    if (typeof Babel === "undefined" || typeof React === "undefined" || typeof ReactDOM === "undefined") {
      fail("This app needs an internet connection to load. Check your WiFi or mobile data, then tap Try again. If you're on office/school WiFi, it may be blocking part of the app — try mobile data.");
      return;
    }
    try {
      var src = document.getElementById("app-source").textContent;
      var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
      (0, eval)(out);
    } catch (e) {
      console.error(e);
      fail("Something went wrong starting the app: " + String(e && e.message ? e.message : e));
    }
  }

  // wait until scripts are ready (up to ~8s), then start or show a clear message
  var tries = 0;
  (function waitReady(){
    if (typeof Babel !== "undefined" && typeof React !== "undefined" && typeof ReactDOM !== "undefined") { start(); return; }
    if (tries++ > 80) { start(); return; } // will show the connection message
    setTimeout(waitReady, 100);
  })();
})();
</script>
</body>
